# market-server 市场管理面 API
# 生成方式: 静态分析（controller 注解 + DTO 字段），未运行服务
# 对应全景: .sddu/docs-tree-root/api.md（业务视角接口清单）

openapi: 3.0.3
info:
  title: market-server 市场管理面 API
  version: v1.0
  description: 市场管理面：数据字典、LookUp 管理、嵌入能力管理（平台面）、应用审批、文件上传
servers:
  -
    url: "http://localhost:18083/market-server"
    description: market-server 本地服务
tags:
  - name: 健康检查
  - name: 能力管理
  - name: 审批管理
  - name: 机器人绑定管理
  - name: 数据字典管理
