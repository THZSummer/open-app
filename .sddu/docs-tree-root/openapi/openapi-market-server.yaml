components:
  securitySchemes:
    internalAuth:
      type: http
      scheme: bearer
      description: 管理面内部凭证（open-server/market-server）
    akskAuth:
      type: apiKey
      in: header
      name: X-AKSK-TOKEN
      description: 消费面 AKSK 认证（api-server/event-server/connector-api），另支持 X-SOA-TOKEN / X-APIG-APPID
  schemas:
    AdminAbilityCreateRequest:
      type: object
      properties:
        abilityType:
          type: integer
          format: int32
        nameCn:
          type: string
        nameEn:
          type: string
        descCn:
          type: string
        descEn:
          type: string
        orderNum:
          type: integer
          format: int32
        entryUrl:
          type: string
        routePath:
          type: string
        aliasName:
          type: string
        hidden:
          type: integer
          format: int32
        requireRelease:
          type: integer
          format: int32
        loadType:
          type: integer
          format: int32
        iconBatchId:
          type: string
        diagramBatchId:
          type: string
    AdminAbilityUpdateRequest:
      type: object
      properties:
        nameCn:
          type: string
        nameEn:
          type: string
        descCn:
          type: string
        descEn:
          type: string
        orderNum:
          type: integer
          format: int32
        entryUrl:
          type: string
        routePath:
          type: string
        aliasName:
          type: string
        hidden:
          type: integer
          format: int32
        requireRelease:
          type: integer
          format: int32
        loadType:
          type: integer
          format: int32
        iconBatchId:
          type: string
        diagramBatchId:
          type: string
        lastUpdateTime:
          type: string
          format: date-time
    AdminAbilityVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        abilityType:
